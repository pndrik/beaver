---
version: 1
metadata:
  name: pr_review_flow
  display_name: PR Review Flow
  description: Clones the repository of a Bitbucket pull request and reviews it.
spec:
  contexts:
    work:
      agent: coder
      chroot:
        path: "runs/{{ Ctx.trace_id }}"
        create: true
        delete: true
  triggers:
    webhook:
      name: pr_review_flow
      token: "REPLACE_ME"
  steps:
    - name: clone
      context: work
      type: tool
      arguments:
        tool: git_clone
        scopes: ["*"]
        arguments:
          url: "{{ Body.repository.links.html.href }}"
          path: "/repo"
    - name: review
      context: work
      type: agent
      arguments:
        prompt: |
          Review the pull request "{{ Body.pullrequest.title }}" in /repo.
          Clone said: {{ Steps.clone.output }}
