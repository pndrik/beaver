---
version: 1
metadata:
  name: pr_review_flow
  display_name: PR Review Flow
  description: Clones the repository of a Bitbucket pull request and reviews it.
spec:
  arguments:
    state: { required: true }
    branch: { required: true }
    url: { required: true, regex: "^https://" }
    title: {}
  contexts:
    work:
      agent: coder
      chroot:
        path: "runs/{{ Ctx.trace_id }}"
        create: true
        delete: true
  triggers:
    webhook:
      name: pr_review_flow
      token: "REPLACE_ME"
      arguments:
        state: "{{ Body.pullrequest.state }}"
        branch: "{{ Body.pullrequest.destination.branch.name }}"
        url: "{{ Body.repository.links.html.href }}"
        title: "{{ Body.pullrequest.title }}"
  steps:
    - name: clone
      context: work
      type: tool
      # Only open pull requests into main or develop.
      when: &reviewable
        - all:
          - { left: "{{ Arguments.state }}", operator: "==", right: OPEN }
          - { left: "{{ Arguments.branch }}", operator: "~=", right: "^(main|develop)$" }
      arguments:
        tool: git_clone
        scopes: ["*"]
        arguments:
          url: "{{ Arguments.url }}"
          path: "/repo"
    - name: review
      context: work
      type: agent
      when: *reviewable
      arguments:
        prompt: |
          Review the pull request "{{ Arguments.title }}" in /repo.
          Clone said: {{ Contexts.work.last().content }}
