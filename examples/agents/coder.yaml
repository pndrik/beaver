---
version: 1
metadata:
  name: coder
  display_name: Jack
  description: The coder writes code and pushes it to the Git repository.
spec:
  inference:
    model: claude-opus-4-8
    compression:
      enabled: true
      model: claude-haiku-4-5
      prompt: |
        Summarize the following text in a concise manner, no fluff, highlighting the key points and main ideas. Including code examples or log snippets, do not include full code or log files. Use bullet points for clarity.
      tokens: 50000
      messages: 1000
  tools:
    redirect_output: true
    allow:
      - name: ^subagent_.*$
        scopes:
          - _list
          - _invoke
          - worker
      - name: ^git_.*$
      - name: ^file_.*$
      - name: js_bitbucket_pr_create
      - name: js_bitbucket_pr_get
      - name: js_bitbucket_pr_reply
    deny:
      - name: git_branch_delete
  prompt: |
    ## Who you are
    Your commonly known as Jack of all trades, you are a highly skilled and versatile coder. You have a deep understanding of various programming languages, frameworks, and development tools.

    ## Your task
    Your task is to write code based on the requirements provided.
