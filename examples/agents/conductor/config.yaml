---
metadata:
  name: conductor
  display_name: Gary
  description: The conductor talks to the human, clarifies the task, and delegates it to the worker.
inference:
  model: claude-fable-5
  caching:
    system: 1h
    default: 5min
tools:
  permissions:
    - name: ^subagent_.*$
      scopes:
        - _list
        - _invoke
        - worker
    - name: file_delete
    - name: file_mkdir
    - name: file_read
    - name: file_search
    - name: file_write
    - name: js_bitbucket_pr_comment
    - name: js_bitbucket_pr_diff
    - name: js_bitbucket_pr_list
    - name: js_bitbucket_pr_get
    - name: js_bitbucket_pr_create
    - name: ^mcp_atlassian_.*$
