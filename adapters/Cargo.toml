[package]
name = "app-adapters"
version.workspace = true
edition.workspace = true

[dependencies]
app-domains.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
yaml_serde.workspace = true
tokio.workspace = true
async-trait.workspace = true
regex.workspace = true
http.workspace = true
base64.workspace = true
chrono.workspace = true

genai = "0.7.0-rc.4"
config = "0.15.27"
minijinja = { version = "3.0.0", features = ["serde"] }
boa_engine = "0.22.0"
boa_runtime = "0.22.0"
boa_gc = "0.22.0"
rmcp = { version = "3.5.1", features = [
  "client",
  "transport-streamable-http-client-reqwest",
  "auth",
] }
walkdir = "2.5.0"
git2 = { version = "0.21.0", features = ["https", "ssh", "vendored-libgit2", "vendored-openssl"] }
ssh2 = { version = "0.9.6", features = ["vendored-openssl"] }

[dev-dependencies]
tempfile = "3.27"
