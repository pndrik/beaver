configuration:
  inference:
    providers:
      anthropic:
        enabled: true
        apikey: "<your_anthropic_api_key>"
  tools:
    providers:
      mcp:
        enabled: true
        servers:
          - name: atlassian
            description: "MCP server allowing access to Jira and Confluence."
            url: "https://mcp.atlassian.com/v1/mcp/preview"
            credentials:
              basic:
                username: "<Username>"
                password: "<API Token>"
    configuration:
      js_bitbucket_pr:
        api_key: "<your_bitbucket_api_key>"
      js_slack:
        api_key: "<your_slack_token>"
      git:
        repositories:
          - url: "^ssh://git@bitbucket.org:example/.*$"
            email: "beaver@example.com"
            display_name: "Beaver Bot"
            ssh_key: |
              -----BEGIN OPENSSH PRIVATE KEY-----
              <your_ssh_private_key>
              -----END OPENSSH PRIVATE KEY-----
            known_hosts:
              - "bitbucket.org ssh-rsa "
              - "bitbucket.org ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBPIQmuzMBuKdWeF4+a2sjSSpBK0iqitSQ+5BM9KhpexuGt20JpTVM7u5BDZngncgrqDMbWdxMWWOGtZ9UgbqgZE="
              - "bitbucket.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIazEu89wgQZ4bqs3d63QSMzYVa0MuJ2e2gKTKqu+UUO"
agents:
  reviewer:
    metadata:
      name: reviewer
      display_name: Reviewer
      description: The reviewer reviews pull requests and provides feedback.
    inference:
      model: claude-fable-5
    tools:
      permissions:
        - name: js_bitbucket_pr_comment
        - name: js_bitbucket_pr_diff
        - name: js_bitbucket_pr_get
        - name: file_find
        - name: file_read
        - name: file_search
    prompt: |
      Your task is to review pull requests and provide feedback.

flows:
  pr_review_flow:
    version: 1
    metadata:
      name: pr_review_flow
      display_name: PR Review Flow
      description: Checks out the pull request in a temporary directory and reviews it with the full code base at hand.
    spec:
      arguments:
        repository: { required: true, pattern: "^[\\w.-]+/[\\w.-]+$" }
        branch: { required: true }
        workspace: {}
        repository_name: {}
        pull_request: { type: number, required: true }
        title: {}
      contexts:
        review:
          agent: reviewer
          chroot:
            path: "runs/{{ Ctx.trace_id }}"
            create: true
            delete: true
      triggers:
        webhook:
          name: pr_review_flow
          token: "REPLACE_WITH_YOUR_FLOW_TOKEN"
          arguments:
            repository: "{{ Body.repository.full_name }}"
            branch: "{{ Body.pullrequest.source.branch.name }}"
            workspace: "{{ Body.repository.workspace.slug }}"
            repository_name: "{{ Body.repository.name }}"
            pull_request: "{{ Body.pullrequest.id }}"
            title: "{{ Body.pullrequest.title }}"
      steps:
        - name: clone
          context: review
          type: tool
          arguments:
            tool: git_clone
            arguments:
              url: "ssh://git@bitbucket.org:{{ Arguments.repository }}.git"
              path: "/repo"
        - name: checkout
          context: review
          type: tool
          arguments:
            tool: git_checkout
            arguments:
              path: "/repo"
              branch: "{{ Arguments.branch }}"
        - name: review
          context: review
          type: agent
          arguments:
            prompt: |
              The pull request branch is checked out in /repo, use the file tools to read the surrounding code.
              Review the changes and provide your feedback as comments on the pull request.

              Workspace: {{ Arguments.workspace }}
              Repository: {{ Arguments.repository_name }}
              Pull request id: {{ Arguments.pull_request }}
              Title: {{ Arguments.title }}
