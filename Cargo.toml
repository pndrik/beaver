[workspace]
resolver = "2"
members = [
  "adapters",
  "app",
  "domains",
  "platforms/cli",
  "platforms/webhook"
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.lints.rust]
future_incompatible = { level = "warn", priority = 1 }
nonstandard_style = { level = "deny", priority = 2 }

[workspace.lints.clippy]
all = { level = "deny", priority = 12 }
redundant_clone = { level = "deny", priority = 11 }
similar_names = { level = "allow", priority = 10 }
unnecessary_wraps = { level = "allow", priority = 9 }
wildcard_imports = { level = "allow", priority = 8 }
missing_errors_doc = { level = "allow", priority = 7 }
must_use_candidate = { level = "allow", priority = 6 }
unused_async = { level = "allow", priority = 5 }
manual_while_let_some = { level = "deny", priority = 4 }
pedantic = { level = "warn", priority = 3 }

[workspace.dependencies]
app = { path = "app" }
app-domains = { path = "domains" }
app-adapters = { path = "adapters" }

reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1.92"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
yaml_serde = "0.10"
uuid = { version = "1.28.0", features = ["v4"] }
regex = "1.13.1"
http = "1.5.0"
base64 = "0.23.1"
chrono = "0.4.45"
subtle = "2.6"
tempfile = "3.27"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["std", "registry", "tracing-log"] }
